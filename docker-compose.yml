services:
  api:
    build:
      context: ./backend
    # Local dev uses runserver with reload; prod image defaults to gunicorn.
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DJANGO_DEBUG: "1"
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
    restart: unless-stopped
  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
